name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 3 * * *'  # Nightly run for fuzzing seeds

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff Lint
        run: ruff check .
      - name: Ruff Format Check
        run: ruff format --check .
      - name: Mypy Strict Type Check
        run: mypy --strict peerq tests bench examples

  test-and-coverage:
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run Architecture & Unit Tests
        run: pytest tests/unit/
      - name: Run Property Tests (Hypothesis)
        run: pytest tests/property/
      - name: Run Deterministic Simulation Tests (Fixed Seeds)
        run: pytest tests/sim/ --durations=10
      - name: Full Test Coverage Floor Check (>= 90%)
        run: pytest --cov=peerq --cov-report=term-missing --cov-report=xml tests/

  simulation-nightly:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run Extended Seed Fuzzing
        run: python -m pytest tests/sim/ -m "fuzz" --seed-count=200
      - name: Upload Failure Artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-simulation-seed-trace
          path: sim_failure_trace_*.log

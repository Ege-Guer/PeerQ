name: CI

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install all dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install --upgrade setuptools
        pip install -e .[dev]
        pip install pytest-asyncio pytest-mock hypothesis
    - name: Run tests
      run: |
        pytest -v --cov=peerq --cov-report=xml --cov-report=term-missing tests/
    - name: Static checks
      run: |
        ruff check peerq tests
        ruff format --check peerq tests
        mypy peerq
    - name: Compile and build wheel
      run: |
        python -m compileall -q peerq tests
        python -m pip wheel . --no-deps --no-build-isolation --wheel-dir "$RUNNER_TEMP/wheel"
    - name: Dependency audit
      run: |
        python -m pip install pip-audit
        pip-audit
    - name: Upload coverage
      uses: codecov/codecov-action@v3
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        file: ./coverage.xml
        fail_ci_if_error: false
